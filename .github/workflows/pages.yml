name: Deploy research dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'feedback_lab/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run sector model regression tests
        run: PYTHONPATH=. python -m unittest tests.test_sector_capacity
      - name: Build dashboard data
        run: PYTHONPATH=. python site/build_data.py
      - name: Validate generated asset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('site/data.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['schema'] == 1
          assert len(d['history']['quarterly']) == 12
          assert len(d['sectors']) == 75
          assert d['uncertainty']['samples'] == 64
          print('Dashboard asset validated:', p.stat().st_size, 'bytes')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
