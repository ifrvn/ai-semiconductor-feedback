name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python -m feedback_lab compare --end-year 2030 --output results/smoke.csv
      - run: python -m feedback_lab.calibration --output results/calibration.json
      - run: python -m feedback_lab.evidence --output results/evidence_audit.json
      - run: python -m feedback_lab.transmission --output results/transmission.json
      - run: python -m feedback_lab.dynamic_experiments --end-year 2030 --output results/dynamic_smoke.csv
      - run: python -m feedback_lab.sector_experiments --end-year 2030 --output results/sector_smoke.csv
      - run: python -m feedback_lab.uncertainty --samples 12 --seed 42 --end-year 2028 --output results/uncertainty_smoke.json
