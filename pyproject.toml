[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-semiconductor-feedback"
version = "0.1.0"
description = "Exploratory feedback model for AI and semiconductor co-evolution"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["feedback_lab*"]
